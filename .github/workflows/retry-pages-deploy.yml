name: Retry failed Pages deploy

# When Deploy Jekyll dies on a hung syncing_files (hard 10-minute Pages cap),
# wait for the platform to recover and re-run the failed jobs once or twice.
on:
  workflow_run:
    workflows: ["Deploy Jekyll site"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: >
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages sync to recover
        run: sleep 900

      - name: Re-run failed deploy jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Re-running failed jobs for run ${{ github.event.workflow_run.id }} (attempt ${{ github.event.workflow_run.run_attempt }})"
          gh run rerun "${{ github.event.workflow_run.id }}" \
            --failed \
            --repo "${{ github.repository }}"
