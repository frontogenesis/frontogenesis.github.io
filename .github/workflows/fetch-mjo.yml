name: Fetch MJO index

# NOAA PSL CORe VPM (vpm.1x.CORe.txt) usually updates after mid-day UTC.
# A single early run can still see yesterday's row and exit with "no
# change". Run later, a few times.
#
# Pages deploy happens in this same workflow when the JSON changes.
# Commits made with GITHUB_TOKEN do not trigger deploy.yml on push.
# Live weatherprogrammer.com is S3/CloudFront — also sync the JSON there.
on:
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch-mjo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch MJO (CORe VPM) index from NOAA PSL
        run: python3 .github/scripts/fetch_mjo.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- vp200_regression_maps/mjo-rmm.json; then
            git add vp200_regression_maps/mjo-rmm.json
            git commit -m "chore: update MJO index (CORe VPM)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Updated mjo-rmm.json:"
            cat vp200_regression_maps/mjo-rmm.json
          else
            echo "no change (NOAA latest already committed)"
            cat vp200_regression_maps/mjo-rmm.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Always sync (not only on git change) so a re-run heals S3 after a
      # partial failure where the commit succeeded but upload did not.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync mjo-rmm.json to S3 / CloudFront
        env:
          WEATHERPROGRAMMER_S3_BUCKET: weatherprogrammer.com
          WEATHERPROGRAMMER_CLOUDFRONT_ID: ${{ secrets.WEATHERPROGRAMMER_CLOUDFRONT_ID }}
        run: |
          set -euo pipefail
          aws s3 cp vp200_regression_maps/mjo-rmm.json \
            "s3://${WEATHERPROGRAMMER_S3_BUCKET}/vp200_regression_maps/mjo-rmm.json" \
            --cache-control "public, max-age=60, must-revalidate" \
            --content-type "application/json"
          if [[ -z "${WEATHERPROGRAMMER_CLOUDFRONT_ID:-}" ]]; then
            echo "WEATHERPROGRAMMER_CLOUDFRONT_ID unset; skipping invalidation"
            exit 0
          fi
          REF="mjo-${GITHUB_RUN_ID}-$(date -u +%Y%m%d%H%M%S)"
          aws cloudfront create-invalidation \
            --distribution-id "$WEATHERPROGRAMMER_CLOUDFRONT_ID" \
            --invalidation-batch "{\"Paths\":{\"Quantity\":1,\"Items\":[\"/vp200_regression_maps/mjo-rmm.json\"]},\"CallerReference\":\"${REF}\"}"

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      # Explicit ref: main so we build the commit just pushed, not the
      # workflow's starting SHA (which is still the pre-update commit).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
